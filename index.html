<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Principal - Sistemas</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #09090b 0%, #18181b 100%);
            --card-bg: #121216;
            --card-border: #27272a;
            --text-main: #f4f4f5;
            --text-label: #a1a1aa;
            --input-bg: #18181b;
            --input-border: #27272a;
            --input-text: #ffffff;
            --btn-bg: #7c3aed;
            --btn-hover: #6d28d9;
            --result-bg: #18181b;
            --switch-bg: #7c3aed; 
        }

        [data-theme="light"] {
            --bg-gradient: linear-gradient(135deg, #f4f7f6 0%, #e2e8f0 100%);
            --card-bg: white;
            --card-border: #cbd5e1;
            --text-main: #1e293b;
            --text-label: #475569;
            --input-bg: #ffffff;
            --input-border: #cbd5e1;
            --input-text: #000000;
            --btn-bg: #2563eb;
            --btn-hover: #1d4ed8;
            --result-bg: #f8fafc;
            --switch-bg: #0fbcf9; 
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: var(--bg-gradient); 
            margin: 0; 
            padding: 20px; 
            display: flex; 
            flex-direction: column;
            justify-content: center; 
            align-items: center;
            min-height: 100vh;
            color: var(--text-main);
            transition: background 0.3s ease, color 0.3s ease;
            box-sizing: border-box;
        }

        .wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 400px;
            position: relative;
        }

        #logo {
            width: 100%;
            max-width: 420px;
            margin-bottom: 20px;
            height: auto;
            display: block;
            transition: transform 0.3s ease;
        }
        
        .card { 
            background: var(--card-bg); 
            padding: 35px; 
            border-radius: 12px; 
            box-shadow: 0 10px 30px rgba(139, 92, 246, 0.15); 
            border: 1px solid var(--card-border);
            width: 100%; 
            box-sizing: border-box;
            position: relative;
            transition: transform 0.3s ease, border-color 0.3s ease, background 0.3s ease;
        }
        
        .card:hover {
            transform: translateY(-3px) scale(1.01);
        }

        .theme-switch-container {
            position: absolute;
            top: 20px;
            right: 20px;
        }

        .theme-switch {
            position: relative;
            display: inline-block;
            width: 56px;
            height: 28px;
        }

        .theme-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: var(--switch-bg);
            transition: 0.4s;
            border-radius: 28px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 22px;
            width: 22px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: 0.4s;
            border-radius: 50%;
            z-index: 2;
        }

        .slider:after {
            content: "🌙";
            position: absolute;
            right: 7px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 13px;
            opacity: 1;
            transition: 0.4s;
        }

        input:checked + .slider:before {
            transform: translateX(28px);
        }

        input:checked + .slider:after {
            content: "☀️";
            left: 7px;
            right: auto;
        }

        h2 { 
            color: var(--text-main); 
            text-align: center; 
            margin-top: 10px;
            margin-bottom: 10px;
            font-size: 24px;
        }

        p.subtitle {
            text-align: center;
            color: var(--text-label);
            font-size: 14px;
            margin-top: 0;
            margin-bottom: 25px;
        }
        
        .menu-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .menu-btn { 
            background-color: var(--btn-bg); 
            color: white; 
            border: none; 
            padding: 14px; 
            width: 100%; 
            border-radius: 6px; 
            font-size: 16px; 
            font-weight: 600;
            cursor: pointer; 
            text-align: center;
            text-decoration: none;
            display: inline-block;
            box-sizing: border-box;
            transition: background-color 0.2s, transform 0.1s;
        }
        
        .menu-btn:hover { 
            background-color: var(--btn-hover);
            transform: scale(1.02); 
        }
        
        .menu-btn:active {
            transform: scale(0.98);
        }
        #logo:hover {
            transform: scale(1.05);
            transition: transform 0.3s ease;
        }
    </style>
</head>
<body>
    <img src="Logotipo3.png" alt="Logotipo" id="logo">

    <div class="theme-switch-container">
        <label class="theme-switch">
            <input type="checkbox" id="theme-toggle">
            <span class="slider"></span>
        </label>
    </div>

    <div class="wrapper">

        <div class="card">
            <h2>Painel de Sistemas</h2>
            <p class="subtitle">Selecione a ferramenta desejada</p>

            <div class="menu-container">
                <a href="Cavaco.html" class="menu-btn">Calculadora de Cavaco</a>
                <a href="SAL.html" class="menu-btn">Sistema de Ajuste Laboratorial (S.A.L)</a>
            </div>
        </div>
    </div>

    <script>
        const themeToggle = document.getElementById('theme-toggle');
        const savedTheme = localStorage.getItem('theme');

        if (savedTheme === 'light') {
            document.documentElement.setAttribute('data-theme', 'light');
            themeToggle.checked = true;
        } else {
            document.documentElement.setAttribute('data-theme', 'dark');
            themeToggle.checked = false;
        }

        function toggleTheme(e) {
            if (e.target.checked) {
                document.documentElement.setAttribute('data-theme', 'light');
                localStorage.setItem('theme', 'light');
            } else {
                document.documentElement.setAttribute('data-theme', 'dark');
                localStorage.setItem('theme', 'dark');
            }
        }

        themeToggle.addEventListener('change', toggleTheme);
    </script>
</body>
</html>
