<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Ajuste Laboratorial (S.A.L)</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #09090b 0%, #18181b 100%);
            --card-bg: #121216;
            --card-border: #27272a;
            --text-main: #f4f4f5;
            --text-label: #a1a1aa;
            --input-bg: #18181b;
            --input-border: #27272a;
            --input-text: #ffffff;
            --btn-bg: #7c3aed;
            --btn-hover: #6d28d9;
            --result-bg: #18181b;
            --switch-bg: #7c3aed; 
        }

        [data-theme="light"] {
            --bg-gradient: linear-gradient(135deg, #f4f7f6 0%, #e2e8f0 100%);
            --card-bg: white;
            --card-border: #cbd5e1;
            --text-main: #1e293b;
            --text-label: #475569;
            --input-bg: #ffffff;
            --input-border: #cbd5e1;
            --input-text: #000000;
            --btn-bg: #2563eb;
            --btn-hover: #1d4ed8;
            --result-bg: #f8fafc;
            --switch-bg: #0fbcf9; 
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: var(--bg-gradient); 
            margin: 0; 
            padding: 40px; 
            display: flex; 
            justify-content: center; 
            align-items: center;
            min-height: 100vh;
            color: var(--text-main);
            transition: background 0.3s ease, color 0.3s ease;
        }
        
        .card { 
            background: var(--card-bg); 
            padding: 35px; 
            border-radius: 12px; 
            box-shadow: 0 10px 30px rgba(139, 92, 246, 0.15); 
            border: 1px solid var(--card-border);
            width: 100%; 
            max-width: 400px; 
            position: relative;
            transition: transform 0.3s ease, border-color 0.3s ease, background 0.3s ease;
        }
        
        .card:hover {
            transform: translateY(-3px);
        }

        .theme-switch-container {
            position: absolute;
            top: 20px;
            right: 20px;
        }

        .theme-switch {
            position: relative;
            display: inline-block;
            width: 56px;
            height: 28px;
        }

        .theme-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: var(--switch-bg);
            transition: 0.4s;
            border-radius: 28px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 22px;
            width: 22px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: 0.4s;
            border-radius: 50%;
            z-index: 2;
        }

        .slider:after {
            content: "🌙";
            position: absolute;
            right: 7px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 13px;
            opacity: 1;
            transition: 0.4s;
        }

        input:checked + .slider:before {
            transform: translateX(28px);
        }

        input:checked + .slider:after {
            content: "☀️";
            left: 7px;
            right: auto;
        }

        h2 { 
            color: var(--text-main); 
            text-align: center; 
            margin-top: 10px;
            margin-bottom: 25px;
            font-size: 22px;
        }

        label { 
            display: block; 
            margin-top: 15px; 
            font-weight: 600; 
            color: var(--text-label); 
            font-size: 14px;
        }
        
        input[type="number"] { 
            width: 100%; 
            padding: 12px; 
            margin-top: 6px; 
            background: var(--input-bg);
            border: 1px solid var(--input-border); 
            border-radius: 6px; 
            box-sizing: border-box; 
            font-size: 15px;
            color: var(--input-text);
            transition: border-color 0.2s, box-shadow 0.2s, background 0.2s, color 0.2s;
        }
        
        input:focus {
            outline: none;
            border-color: #8b5cf6;
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.25);
        }
        
        button.calc-btn { 
            background-color: var(--btn-bg); 
            color: white; 
            border: none; 
            padding: 14px; 
            width: 100%; 
            border-radius: 6px; 
            margin-top: 24px; 
            font-size: 16px; 
            font-weight: 600;
            cursor: pointer; 
            transition: background-color 0.2s, transform 0.1s;
        }
        
        button.calc-btn:hover { 
            background-color: var(--btn-hover); 
        }
        
        button.calc-btn:active {
            transform: scale(0.98);
        }
        
        #resultado { 
            margin-top: 20px; 
            padding: 15px; 
            background: var(--result-bg); 
            border: 1px solid var(--card-border);
            border-radius: 6px; 
            text-align: center; 
            font-weight: 600; 
            display: none; 
            color: var(--text-main);
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: var(--text-label);
            text-decoration: none;
            font-size: 14px;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: var(--text-main);
        }
        </style>
</head>
<body>
    <div class="theme-switch-container">
        <label class="theme-switch">
            <input type="checkbox" id="theme-toggle">
            <span class="slider"></span>
        </label>
    </div>

    <div class="card">

        <h2>Sistema de Ajuste Laboratorial (S.A.L)</h2>

        <div>
            <label for="umidadeDesejada">Digite a umidade desejada (%):</label>
            <input type="number" id="umidadeDesejada" step="0.01" placeholder="Ex: 12.01">
        </div>

        <button type="button" class="calc-btn" onclick="calcularOleo()">Calcular Ajuste</button>

        <div id="resultado"></div>

        <a href="index.html" class="back-link">← Voltar ao Menu Principal</a>
    </div>

    <script>
        function calcularOleo() {
            const umidadeOriginal = 12.01;
            const oleoOriginal = 20.82;
            
            const inputDesejada = document.getElementById('umidadeDesejada').value;
            const umidadeDesejada = parseFloat(inputDesejada);
            
            const divResultado = document.getElementById('resultado');

            if (isNaN(umidadeDesejada)) {
                divResultado.style.display = 'block';
                divResultado.innerHTML = "Por favor, insira um valor válido para a umidade.";
                return;
            }

            const resultado = oleoOriginal * ((100 - umidadeDesejada) / (100 - umidadeOriginal));
            const resultadoArredondado = resultado.toFixed(2);

            divResultado.style.display = 'block';
            divResultado.innerHTML = `Ref: ${umidadeOriginal}% | Desejada: ${umidadeDesejada}%<br><br><strong>Óleo Corrigido: ${resultadoArredondado}%</strong>`;
        }

        const themeToggle = document.getElementById('theme-toggle');
        const savedTheme = localStorage.getItem('theme');

        if (savedTheme === 'light') {
            document.documentElement.setAttribute('data-theme', 'light');
            themeToggle.checked = true;
        } else {
            document.documentElement.setAttribute('data-theme', 'dark');
            themeToggle.checked = false;
        }

        function toggleTheme(e) {
            if (e.target.checked) {
                document.documentElement.setAttribute('data-theme', 'light');
                localStorage.setItem('theme', 'light');
            } else {
                document.documentElement.setAttribute('data-theme', 'dark');
                localStorage.setItem('theme', 'dark');
            }
        }

        themeToggle.addEventListener('change', toggleTheme);
    </script>
</body>
</html>
