<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Lançamento</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #09090b 0%, #18181b 100%);
            --card-bg: #121216;
            --card-border: #27272a;
            --text-main: #f4f4f5;
            --text-label: #a1a1aa;
            --input-bg: #18181b;
            --input-border: #27272a;
            --input-text: #ffffff;
            --btn-bg: #7c3aed;
            --btn-hover: #6d28d9;
            --result-bg: #18181b;
            --switch-bg: #7c3aed; 
        }

        [data-theme="light"] {
            --bg-gradient: linear-gradient(135deg, #f4f7f6 0%, #e2e8f0 100%);
            --card-bg: white;
            --card-border: #cbd5e1;
            --text-main: #1e293b;
            --text-label: #475569;
            --input-bg: #ffffff;
            --input-border: #cbd5e1;
            --input-text: #000000;
            --btn-bg: #2563eb;
            --btn-hover: #1d4ed8;
            --result-bg: #f8fafc;
            --switch-bg: #0fbcf9; 
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: var(--bg-gradient); 
            margin: 0; 
            padding: 20px; 
            display: flex; 
            flex-direction: column;
            justify-content: center; 
            align-items: center;
            min-height: 100vh;
            color: var(--text-main);
            transition: background 0.3s ease, color 0.3s ease;
            box-sizing: border-box;
        }

        .wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 420px;
            position: relative;
        }

        #logo {
            width: 100%;
            max-width: 420px;
            height: auto;
            margin-bottom: 20px;
            display: block;
            transition: transform 0.3s ease;
        }
        
        .card { 
            background: var(--card-bg); 
            padding: 35px; 
            border-radius: 12px; 
            box-shadow: 0 10px 30px rgba(139, 92, 246, 0.15); 
            border: 1px solid var(--card-border);
            width: 100%; 
            box-sizing: border-box;
            position: relative;
            transition: transform 0.3s ease, border-color 0.3s ease, background 0.3s ease;
        }
        
        .card:hover {
            transform: scale(1.01);
        }

        .theme-switch-container {
            position: absolute;
            top: 20px;
            right: 20px;
        }

        .theme-switch {
            position: relative;
            display: inline-block;
            width: 56px;
            height: 28px;
        }

        .theme-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: var(--switch-bg);
            transition: 0.4s;
            border-radius: 28px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 22px;
            width: 22px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: 0.4s;
            border-radius: 50%;
            z-index: 2;
        }

        .slider:after {
            content: "🌙";
            position: absolute;
            right: 7px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 13px;
            opacity: 1;
            transition: 0.4s;
        }

        input:checked + .slider:before {
            transform: translateX(28px);
        }

        input:checked + .slider:after {
            content: "☀️";
            left: 7px;
            right: auto;
        }

        h2 { 
            color: var(--text-main); 
            text-align: center; 
            margin-top: 10px;
            font-size: 24px;
        }
        
        label { 
            display: block; 
            margin-top: 12px; 
            font-weight: 600; 
            color: var(--text-label); 
            font-size: 14px;
        }
        
        input[type="text"], input[type="number"] { 
            width: 100%; 
            padding: 12px; 
            margin-top: 6px; 
            background: var(--input-bg);
            border: 1px solid var(--input-border); 
            border-radius: 6px; 
            box-sizing: border-box; 
            font-size: 15px;
            color: var(--input-text);
            transition: border-color 0.2s, box-shadow 0.2s, background 0.2s, color 0.2s;
        }
        
        input:focus {
            outline: none;
            border-color: #8b5cf6;
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.25);
        }

        /* Bloco individual de cada item */
        .item-bloco {
            margin-top: 18px;
            padding: 14px;
            border: 1px solid var(--card-border);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.02);
            position: relative;
            animation: fadeIn 0.25s ease-in-out;
        }

        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }

        .item-titulo {
            font-size: 13px;
            font-weight: 700;
            color: var(--btn-bg);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-remover-item {
            background: transparent;
            border: 1px solid #ef4444;
            color: #ef4444;
            border-radius: 4px;
            padding: 2px 8px;
            font-size: 12px;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
        }

        .btn-remover-item:hover {
            background: #ef4444;
            color: white;
        }

        /* Botão secundário para adicionar mais itens */
        button.Add-Item-Btn {
            background-color: transparent;
            color: var(--text-main);
            border: 1px dashed var(--btn-bg);
            padding: 11px;
            width: 100%;
            border-radius: 6px;
            margin-top: 14px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, border-color 0.2s;
        }

        button.Add-Item-Btn:hover {
            background-color: rgba(124, 58, 237, 0.12);
        }
        
        button.Lancar-Btn { 
            background-color: var(--btn-bg); 
            color: white; 
            border: none; 
            padding: 14px; 
            width: 100%; 
            border-radius: 6px; 
            margin-top: 18px; 
            font-size: 16px; 
            font-weight: 600;
            cursor: pointer; 
            transition: background-color 0.2s, transform 0.1s;
        }
        
        button.Lancar-Btn:hover:not(:disabled) { 
            background-color: var(--btn-hover);
            transform: scale(1.02); 
        }
        
        button.Lancar-Btn:active:not(:disabled) {
            transform: scale(0.98);
        }

        button.Lancar-Btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        #resultado {
            margin-top: 20px;
            padding: 14px;
            background: var(--result-bg);
            border: 1px solid var(--card-border);
            border-radius: 6px;
            text-align: center;
            font-weight: 600;
            font-size: 14px;
            display: none;
            color: var(--text-main);
            animation: fadeIn 0.35s ease-in-out;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: var(--text-label);
            text-decoration: none;
            font-size: 14px;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: var(--text-main);
        }

        #logo:hover {
            transform: scale(1.05);
            transition: transform 0.3s ease;
        }
    </style>
</head>
<body>

    <div class="theme-switch-container">
        <label class="theme-switch">
            <input type="checkbox" id="theme-toggle">
            <span class="slider"></span>
        </label>
    </div>

    <div class="wrapper">
        <img src="Logotipo3.png" alt="Logotipo" id="logo">

        <div class="card">
            <h2>Cadastro de Lançamento</h2>

            <label for="NF">Nota Fiscal:</label>
            <input type="text" id="NF" placeholder="Número da nota fiscal">

            <div id="lista-itens">
                <div class="item-bloco">
                    <div class="item-header">
                        <span class="item-titulo">Item 1</span>
                    </div>
                    <label>Produto:</label>
                    <input type="text" class="campo-produto" placeholder="Nome do produto">

                    <label>Setor (Centro de custo):</label>
                    <input type="text" class="campo-setor" placeholder="CC ou AI">

                    <label>Quantidade:</label>
                    <input type="number" class="campo-quantidade" placeholder="0.0" step="0.1" min="0.1">
                </div>
            </div>

            <button type="button" class="Add-Item-Btn" onclick="adicionarItem()">+ Adicionar outro item</button>

            <button type="button" class="Lancar-Btn" id="btnLancar" onclick="MandarPlanilha()">Lançar</button>

            <div id="resultado" role="status" aria-live="polite"></div>

            <a href="https://docs.google.com/spreadsheets/d/1gBz6zC0uv9vhcZUP2xOFLng_bejidGDdv-W5mW9SSlY/edit?usp=sharing" class="back-link" target="_blank" rel="noopener noreferrer">Abrir Planilha</a>
            <a href="LancamentoDeNotas.html" class="back-link">← Voltar</a>
        </div>
    </div>

    <script>
        const URL_PLANILHA = "https://script.google.com/macros/s/AKfycbysrZXLabqkQpdPng97Gtsloac3rcvD-l6eeUxlunmp8EQtNm7TCgWNxDWHZcfTopmghw/exec";

        const themeToggle = document.getElementById('theme-toggle');
        const htmlElement = document.documentElement;
        const listaItensDiv = document.getElementById('lista-itens');

        themeToggle.addEventListener('change', () => {
            htmlElement.setAttribute('data-theme', themeToggle.checked ? 'light' : 'dark');
        });

        function adicionarItem() {
            const totalAtual = listaItensDiv.querySelectorAll('.item-bloco').length + 1;

            const novoBloco = document.createElement('div');
            novoBloco.className = 'item-bloco';
            novoBloco.innerHTML = `
                <div class="item-header">
                    <span class="item-titulo">Item ${totalAtual}</span>
                    <button type="button" class="btn-remover-item" onclick="removerItem(this)">Remover</button>
                </div>
                <label>Produto:</label>
                <input type="text" class="campo-produto" placeholder="Nome do produto">

                <label>Setor (Centro de custo):</label>
                <input type="text" class="campo-setor" placeholder="CC ou AI">

                <label>Quantidade:</label>
                <input type="number" class="campo-quantidade" placeholder="0.0" step="0.1" min="0.1">
            `;

            listaItensDiv.appendChild(novoBloco);
            novoBloco.querySelector('.campo-produto').focus();
        }

        function removerItem(botao) {
            const bloco = botao.closest('.item-bloco');
            bloco.remove();

            const blocosRestantes = listaItensDiv.querySelectorAll('.item-bloco');
            blocosRestantes.forEach((el, index) => {
                el.querySelector('.item-titulo').textContent = `Item ${index + 1}`;
            });
        }

        async function MandarPlanilha() {
            const nfInput = document.getElementById('NF');
            const btn = document.getElementById('btnLancar');
            const numeroNF = nfInput.value.trim();

            if (!numeroNF) {
                mostrarMensagem("Informe o número da Nota Fiscal!", "#ef4444");
                nfInput.focus();
                return;
            }

            const blocos = listaItensDiv.querySelectorAll('.item-bloco');
            const itens = [];

            for (let i = 0; i < blocos.length; i++) {
                const produto = blocos[i].querySelector('.campo-produto').value.trim();
                const setor = blocos[i].querySelector('.campo-setor').value.trim().toUpperCase();
                const quantidadeNum = parseFloat(blocos[i].querySelector('.campo-quantidade').value);

                if (!produto || !setor || Number.isNaN(quantidadeNum) || quantidadeNum <= 0) {
                    mostrarMensagem(`Preencha corretamente todos os campos do Item ${i + 1}!`, "#ef4444");
                    return;
                }

                itens.push({
                    produto: produto,
                    setor: setor,
                    quantidade: quantidadeNum
                });
            }

            btn.disabled = true;
            btn.innerText = "Enviando...";

            const payload = {
                acao: "cadastrar",
                numeroNF: numeroNF,
                itens: itens
            };

            try {
                const resposta = await fetch(URL_PLANILHA, {
                    method: "POST",
                    redirect: "follow",
                    headers: {
                        "Content-Type": "text/plain;charset=utf-8"
                    },
                    body: JSON.stringify(payload)
                });

                const json = await resposta.json();

                if (!json.success) {
                    throw new Error(json.message);
                }

                mostrarMensagem(json.message, "#10b981");

                nfInput.value = "";
                listaItensDiv.innerHTML = `
                    <div class="item-bloco">
                        <div class="item-header">
                            <span class="item-titulo">Item 1</span>
                        </div>
                        <label>Produto:</label>
                        <input type="text" class="campo-produto" placeholder="Nome do produto">

                        <label>Setor (Centro de custo):</label>
                        <input type="text" class="campo-setor" placeholder="CC ou AI">

                        <label>Quantidade:</label>
                        <input type="number" class="campo-quantidade" placeholder="0.0" step="0.1" min="0.1">
                    </div>
                `;
                nfInput.focus();
            } catch (error) {
                console.error("Erro:", error);
                mostrarMensagem(error.message || "Erro ao conectar com a planilha.", "#ef4444");
            } finally {
                btn.disabled = false;
                btn.innerText = "Lançar";
            }
        }

        let timeoutMensagem;
        function mostrarMensagem(texto, corBorda) {
            const resultadoDiv = document.getElementById('resultado');
            resultadoDiv.innerText = texto;
            resultadoDiv.style.borderColor = corBorda;
            resultadoDiv.style.display = "block";

            clearTimeout(timeoutMensagem);
            timeoutMensagem = setTimeout(() => {
                resultadoDiv.style.display = "none";
            }, 5000);
        }
    </script>

</body>
</html>
